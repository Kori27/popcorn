<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sorozatnapló</title>
<meta name="description" content="Sorozatkövető: keresés, követett sorozatok, megnézett részek és műsornaptár.">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F111A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sorozatnapló">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell — sticky title bar, one scrolling column, fixed bottom tab bar; detail opens as a full-height sheet. */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#E8EAF2; --fg:#151826; --muted:#5C6178; --line:#DADDE8;
  --accent:#3150D8; --accent-fg:#FFFFFF; --accent-soft:#E2E7FD;
  --ok:#17875A; --ok-soft:#D9F2E5; --warn:#A8620C; --warn-soft:#FBEBD5;
  --shadow:0 1px 2px rgba(21,24,38,.06),0 4px 16px rgba(21,24,38,.06);
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --tabbar:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F111A; --surface:#181B27; --surface-2:#232738; --fg:#E9EBF3; --muted:#99A0B8; --line:#2B3044;
  --accent:#8196FF; --accent-fg:#0F111A; --accent-soft:#232B55;
  --ok:#4CC38A; --ok-soft:#163427; --warn:#E6A954; --warn-soft:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F111A; --surface:#181B27; --surface-2:#232738; --fg:#E9EBF3; --muted:#99A0B8; --line:#2B3044;
  --accent:#8196FF; --accent-fg:#0F111A; --accent-soft:#232B55;
  --ok:#4CC38A; --ok-soft:#163427; --warn:#E6A954; --warn-soft:#3A2A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top-inner{max-width:680px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{font:800 26px/1.1 var(--font-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;white-space:nowrap}

main{max-width:680px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 24px);
  display:flex;flex-direction:column;gap:26px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec-head h2{font:600 19px/1.2 var(--font-display);margin:0}
.sec-head .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar-inner{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:6px;width:52px;height:30px;border-radius:15px;background:var(--accent-soft);z-index:-1}
.tab .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;
  background:var(--accent);color:var(--accent-fg);font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* Posters */
.poster{aspect-ratio:2/3;width:100%;max-width:100%;border-radius:10px;background:var(--surface-2);object-fit:cover;overflow:hidden}
.poster-ph{aspect-ratio:2/3;width:100%;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;
  color:var(--muted);font:600 13px/1.2 var(--font-display);text-align:center;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 12px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.card .name{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .flag{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:13px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:var(--shadow)}
.card .flag svg{width:15px;height:15px}
.progress{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px}
.progress.done i{background:var(--ok)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:112px;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{scroll-snap-align:start}

/* Rows (episodes / up next) */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .thumb{width:52px;border-radius:7px;aspect-ratio:2/3;object-fit:cover;background:var(--surface-2);cursor:pointer}
.row .body{min-width:0;cursor:pointer}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t3{font-size:12.5px;color:var(--muted);margin-top:1px}
.code{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:40px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.small{padding:6px 12px;min-height:34px;font-size:13px}
.check{width:40px;height:40px;border-radius:20px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:transparent;flex:none;transition:background .15s,border-color .15s}
.check svg{width:20px;height:20px}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check:disabled{cursor:default;opacity:.45}

.day{display:flex;flex-direction:column;gap:8px}
.day h3{margin:0;font:600 14px/1.2 var(--font-body);color:var(--muted)}
.day h3 b{color:var(--fg)}

.empty{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h3{margin:0;font:600 18px/1.25 var(--font-display)}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.note{color:var(--muted);font-size:13px}
.error{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:14px}

.search{position:relative}
.search input{width:100%;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  font:16px var(--font-body);padding:0 44px 0 46px;box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:15px;top:13px;width:22px;height:22px;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:18px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.search .clear svg{position:static}

.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}

/* Detail sheet */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sheet-bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--bg)}
.iconbtn{width:42px;height:42px;border-radius:21px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.iconbtn svg{width:22px;height:22px}
.sheet-body{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:start}
.hero h2{font:800 26px/1.1 var(--font-display);margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.hero .actions{display:flex;flex-wrap:wrap;gap:8px}
.summary{margin:0;color:var(--fg);max-width:65ch}
.summary.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 20px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.ep{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.ep:last-child{border-bottom:0}
.ep .no{font:600 13px/1 var(--font-body);font-variant-numeric:tabular-nums;color:var(--muted);width:28px;text-align:right}
.ep .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .d{font-size:12.5px;color:var(--muted)}
.ep.future .t{color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px) + 14px);z-index:60;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);
  max-width:calc(100% - 32px);text-align:center}

.top-inner .right{display:flex;align-items:center;gap:10px;min-width:0}
.top .iconbtn{width:38px;height:38px;box-shadow:none;background:var(--surface-2)}
.top .iconbtn svg{width:20px;height:20px}
.card .meta.mine{color:var(--ok);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px;display:none}
.chip[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip[aria-pressed="true"] svg{display:block}
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font:600 17px/1.25 var(--font-display)}
.panel p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.where{display:flex;flex-direction:column}
.where a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);color:var(--fg);text-decoration:none}
.where a:last-child{border-bottom:0}
.where a b{font-weight:600}
.where a small{grid-column:1;color:var(--muted);font-size:12.5px}
.where a svg{grid-row:1/3;grid-column:2;width:18px;height:18px;color:var(--muted)}
.new-dot{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.placeholder{display:grid;place-items:center;text-align:center;min-height:70vh;color:var(--muted);padding:24px}
.placeholder b{display:block;color:var(--fg);font:600 18px/1.3 var(--font-display);margin-bottom:6px}

@media (min-width:560px){
  .hero{grid-template-columns:160px 1fr}
  .grid{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}
}
/* Tablet / landscape: list on the left, detail pane fixed on the right */
@media (min-width:900px){
  :root{--pane:min(46vw,580px)}
  body{padding-right:var(--pane)}
  .tabbar{right:var(--pane)}
  .toast{left:calc((100% - var(--pane)) / 2)}
  .sheet{left:auto;right:0;width:var(--pane);border-left:1px solid var(--line);animation:none;z-index:26}
  .sheet .sheet-body{padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
  .sheet .hero{grid-template-columns:130px 1fr}
  .sheet [data-close] .ico-back{display:none}
  .sheet [data-close] .ico-x{display:grid}
  .card.active .poster{outline:3px solid var(--accent);outline-offset:2px}
}
.iconbtn .ico-back{display:grid}
.iconbtn .ico-x{display:none}
.player{width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;display:block}
.player video,.player iframe{width:100%;height:100%;border:0;display:block}
.yt{position:relative;width:100%;aspect-ratio:16/9;border:0;border-radius:var(--r);background:#000 center/cover no-repeat;cursor:pointer;padding:0;display:block}
.yt .play{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:34px;background:rgba(0,0,0,.6);display:grid;place-items:center;color:#fff}
.yt .play svg{width:30px;height:30px;margin-left:4px}
.yt:hover .play{background:var(--accent)}
.field{display:flex;gap:8px;flex-wrap:wrap}
.field input{flex:1 1 220px;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:15px var(--font-body);padding:0 12px}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.steps a{color:var(--accent)}
.more{align-self:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"><div class="top-inner"><h1 id="title">Kezdőlap</h1><div class="right"><span class="sub" id="sub"></span>
  <button class="iconbtn" data-settings aria-label="Beállítások"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button></div></div></header>
<main id="view" aria-live="polite"></main>

<nav class="tabbar" aria-label="Fő menü"><div class="tabbar-inner">
  <button class="tab" data-tab="home" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H5.5A1.5 1.5 0 0 1 4 19z"/></svg>Kezdőlap</button>
  <button class="tab" data-tab="watch">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="13" rx="2.5"/><path d="M8 21h8M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>Nézd most</button>
  <button class="tab" data-tab="upcoming">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Érkezik</button>
  <button class="tab" data-tab="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Keresés</button>
  <button class="tab" data-tab="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>Listám<span class="badge" id="libBadge" hidden></span></button>
</div></nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Sorozat adatlap"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
'use strict';
const API = 'https://api.tvmaze.com';
const H = 3600e3, DAY = 24 * H;
const $ = s => document.querySelector(s);
const wide = matchMedia('(min-width:900px)');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICON = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',

  set(k, v) {

    catch {
      try { // full: drop the API cache, keep the user's own data
        Object.keys(localStorage).filter(x => x.startsWith('sn.c.')).forEach(x => localStorage.removeItem(x));
        localStorage.setItem(k, JSON.stringify(v));

};

/* ---------- API with cache ---------- */
const inflight = new Map();
async function api(path, ttl, map = x => x) {
  const key = 'sn.c.' + path;
  const cached = ls.get(key, null);
  if (cached && Date.now() - cached.t < ttl) return cached.d;
  if (inflight.has(path)) return inflight.get(path);
  const p = (async () => {
    try {
      const url = path.startsWith('http') ? path : API + path;
      let r = await fetch(url);
      if (r.status === 429) { await new Promise(res => setTimeout(res, 1500)); r = await fetch(url); }
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = map(await r.json());
      ls.set(key, { t: Date.now(), d });
      return d;
    } catch (e) {
      if (cached) return cached.d;
      throw e;
    } finally { inflight.delete(path); }
  })();
  inflight.set(path, p);
  return p;
}
const strip = h => (h || '').replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&quot;/g, '"').replace(/&#39;/g, "'").trim();
const slimShow = s => s && ({
  id: s.id, name: s.name, img: s.image?.medium || null,
  network: s.network?.name || s.webChannel?.name || '', status: s.status,
  premiered: s.premiered, ended: s.ended, genres: s.genres || [], rating: s.rating?.average ?? null,
  summary: strip(s.summary), runtime: s.runtime || s.averageRuntime || null, url: s.url, lang: s.language, weight: s.weight || 0, imdb: s.externals?.imdb || null
});
const slimEp = e => ({ id: e.id, s: e.season, n: e.number, name: e.name, date: e.airdate, stamp: e.airstamp, rt: e.runtime });
const getShow = id => api(`/shows/${id}`, DAY, slimShow);
const getEps = id => api(`/shows/${id}/episodes`, 6 * H, a => a.map(slimEp));
const getHuName = id => api(`/shows/${id}/akas`, 7 * DAY, a => (a.find(x => x.country?.code === 'HU') || {}).name || null).catch(() => null);
const searchShows = q => api(`/search/shows?q=${encodeURIComponent(q)}`, H, a => a.map(x => slimShow(x.show)));
const POPULAR = ['Severance', 'The Last of Us', 'Stranger Things', 'The Bear', 'Wednesday', 'Shōgun', 'Breaking Bad', 'Dark', 'Succession', 'Fallout'];
const getPopular = () => pool(POPULAR, 4, q => api(`/singlesearch/shows?q=${encodeURIComponent(q)}`, 7 * DAY, slimShow).catch(() => null))
  .then(a => a.filter(Boolean));

async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); }
  }));
  return out;
}

/* ---------- dates & helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const fmtDate = s => s ? new Date(s + 'T12:00:00').toLocaleDateString('hu-HU', { year: 'numeric', month: 'short', day: 'numeric' }) : 'Ismeretlen dátum';
function dayLabel(s) {
  const t = today();
  if (s === t) return 'Ma';
  if (s === addDays(t, 1)) return 'Holnap';
  if (s === addDays(t, -1)) return 'Tegnap';
  const d = new Date(s + 'T12:00:00');
  const wd = d.toLocaleDateString('hu-HU', { weekday: 'long' });
  return wd.charAt(0).toUpperCase() + wd.slice(1);
}
const relDays = s => {
  const diff = Math.round((new Date(s + 'T12:00:00') - new Date(today() + 'T12:00:00')) / DAY);
  if (diff === 0) return 'ma'; if (diff === 1) return 'holnap'; if (diff > 1) return `${diff} nap múlva`;
  return fmtDate(s);
};
const code = e => `S${pad(e.s)}E${pad(e.n ?? 0)}`;
const aired = e => e.stamp ? new Date(e.stamp) <= new Date() : (e.date && e.date <= today());
const regular = eps => eps.filter(e => e.n != null && e.s > 0);
const isWatched = (sid, eid) => !!state.watched[sid]?.[eid];
const STATUS = { 'Running': ['Fut', 'ok'], 'Ended': ['Befejeződött', 'neutral'], 'To Be Determined': ['Bizonytalan', 'warn'], 'In Development': ['Készül', 'accent'] };
const statusPill = s => { const [t, c] = STATUS[s] || [s || 'Ismeretlen', 'neutral']; return `<span class="pill ${c}">${esc(t)}</span>`; };
const year = s => s.premiered ? s.premiered.slice(0, 4) : '';
function progressOf(sid, eps) {
  const a = regular(eps).filter(aired);
  const w = a.filter(e => isWatched(sid, e.id)).length;
  const next = a.find(e => !isWatched(sid, e.id)) || null;
  const upcoming = regular(eps).find(e => !aired(e) && e.date) || null;
  return { aired: a.length, watched: w, next, upcoming, total: regular(eps).length };
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200);
}
function updateBadge() {
  const n = Object.keys(state.follows).length, b = $('#libBadge');
  b.hidden = !n; b.textContent = n;
}

/* ---------- follow / watched ---------- */
function follow(show) {
  state.follows[show.id] = { id: show.id, name: show.name, img: show.img, network: show.network, status: show.status, added: Date.now() };
  save();
}
function toggleFollow(show) {
  if (state.follows[show.id]) { delete state.follows[show.id]; save(); toast(`${show.name} lekerült a listádról`); }
  else { follow(show); toast(`${show.name} felkerült a listádra`); }
}
async function setWatched(sid, eids, on) {
  const m = state.watched[sid] || (state.watched[sid] = {});
  eids.forEach(id => on ? (m[id] = 1) : delete m[id]);
  if (!Object.keys(m).length) delete state.watched[sid];
  if (on && !state.follows[sid]) {
    const s = await getShow(sid).catch(() => null);
    if (s) { follow(s); toast(`Megjelölve · ${s.name} felkerült a listádra`); return; }
  }
  save();
}

/* ---------- Home ---------- */
async function renderHome(v, alive) {
  const ids = Object.keys(state.follows);
  if (!ids.length) {
    v.innerHTML = `<div class="empty"><h3>Kövesd a sorozataidat egy helyen</h3>
      <p>Keress rá egy sorozatra, tedd fel a listádra, és pipáld ki a megnézett részeket. Itt mindig látod, melyik rész jön legközelebb, és mikor jelenik meg az új epizód.</p>
      <button class="btn primary" data-tab="search">${ICON.search}Sorozat keresése</button></div>
      ${servicesSection()}
      <section><div class="sec-head"><h2>Népszerű sorozatok</h2></div><div id="pop">${skelGrid(6)}</div></section>`;
    loadPopular(alive); loadOnMine(alive);
    return;
  }
  v.innerHTML = `<section><div class="sec-head"><h2>Folytasd</h2><span class="count" id="nextCount"></span></div><div id="next">${skelRows(3)}</div></section>
    <section><div class="sec-head"><h2>Hamarosan</h2><span class="count">következő 14 nap</span></div><div id="soon">${skelRows(2)}</div></section>
    ${servicesSection()}
    <section><div class="sec-head"><h2>Népszerű sorozatok</h2></div><div id="pop">${skelGrid(6)}</div></section>`;
  loadOnMine(alive);
  let data;
  try { data = await pool(ids, 4, async id => ({ show: state.follows[id], eps: await getEps(id) || [] })); }
  catch { if (alive()) { $('#next').innerHTML = errorBox(NET_ERR); $('#soon').innerHTML = ''; } return; }
  if (!alive()) return;
  const next = [], soon = [], end = addDays(today(), 14);
  let fresh = 0;
  for (const { show, eps } of data) {
    const p = progressOf(show.id, eps);
    if (p.next) next.push({ show, ep: p.next, left: p.aired - p.watched });
    regular(eps).filter(e => !aired(e) && e.date && e.date <= end).forEach(e => soon.push({ show, ep: e }));
    fresh += regular(eps).filter(e => aired(e) && isNew(e) && !isWatched(show.id, e.id)).length;
  }
  if (fresh && !renderHome.announced) { renderHome.announced = true; toast(fresh === 1 ? '1 új rész jelent meg, amióta legutóbb itt jártál' : `${fresh} új rész jelent meg, amióta legutóbb itt jártál`); }
  state.lastVisit = Date.now(); ls.set('sn.state', state);
  next.sort((a, b) => (b.ep.date || '').localeCompare(a.ep.date || ''));
  $('#nextCount').textContent = next.length ? `${next.length} sorozat` : '';
  $('#next').innerHTML = next.length ? `<div class="list">${next.map(({ show, ep, left }) => `
    <div class="row">
      <img class="thumb" src="${esc(show.img || '')}" alt="" data-open="${show.id}" loading="lazy">
      <div class="body" data-open="${show.id}">
        <div class="t1">${esc(show.name)}${isNew(ep) ? '<span class="new-dot">ÚJ</span>' : ''}</div>
        <div class="t2"><span class="code">${code(ep)}</span> · ${esc(ep.name)}</div>
        <div class="t3">${left > 1 ? `még ${left} rész vár rád` : 'az utolsó megjelent rész'} · ${fmtDate(ep.date)}${mine(show) ? ` · <b style="color:var(--ok)">${esc(mine(show).name)}</b>` : ''}</div>
      </div>
      <button class="check" data-ep="${show.id}:${ep.id}" aria-pressed="false" aria-label="${esc(code(ep))} megnézve">${ICON.check}</button>
    </div>`).join('')}</div>`
    : `<div class="empty"><h3>Mindennel naprakész vagy</h3><p>A követett sorozataid összes megjelent részét megnézted. Ha új rész jön, itt jelenik meg.</p></div>`;
  soon.sort((a, b) => (a.ep.stamp || a.ep.date).localeCompare(b.ep.stamp || b.ep.date));
  $('#soon').innerHTML = soon.length ? groupByDay(soon) : `<p class="note">A követett sorozataidnak nincs új része a következő két hétben.</p>`;
  loadPopular(alive);
}
const isNew = e => !!e.stamp && Date.parse(e.stamp) > prevVisit && aired(e);
function servicesSection() {
  if (!state.services.length) return `<div class="panel"><h3>Mire fizetsz elő?</h3>
    <p>Jelöld be a szolgáltatóidat, és az app kiemeli azokat a sorozatokat, amelyeket nálad meg tudsz nézni.</p>

async function loadOnMine(alive) {
  if (!state.services.length || !$('#onmine')) return;
  try {
    const [pop, web] = await Promise.all([getPopular(), api(`/schedule/web?date=${today()}`, 3 * H, a => a.map(x => slimShow(x._embedded?.show || x.show))).catch(() => [])]);
    if (!alive() || !$('#onmine')) return;
    const seen = new Set(), list = [...pop, ...(web || []).filter(s => (s?.weight || 0) >= 80).sort((a, b) => (b.weight || 0) - (a.weight || 0))]
      .filter(s => s && mine(s) && !state.follows[s.id] && !seen.has(s.id) && seen.add(s.id)).slice(0, 12);
    $('#onmine').innerHTML = list.length ? `<div class="rail">${list.map(s => showCard(s)).join('')}</div>`
      : `<p class="note">Most nincs új ajánlás a szolgáltatóidon. Keress rá egy sorozatra, és az adatlapján látod, hol nézhető.</p>`;
  } catch { if (alive() && $('#onmine')) $('#onmine').innerHTML = errorBox(NET_ERR); }
}
async function loadPopular(alive) {
  try {
    const list = await getPopular();
    if (!alive()) return;
    $('#pop').innerHTML = list.length ? `<div class="rail">${list.map(s => showCard(s)).join('')}</div>` : errorBox(NET_ERR);
  } catch { if (alive()) $('#pop').innerHTML = errorBox(NET_ERR); }
}
function groupByDay(items, withTime = true, premiere = false) {
  const days = new Map();
  items.forEach(it => { const d = it.ep.date; if (!days.has(d)) days.set(d, []); days.get(d).push(it); });
  return [...days].map(([d, arr]) => `<div class="day"><h3><b>${dayLabel(d)}</b> · ${fmtDate(d)}</h3><div class="list">
    ${arr.map(({ show, ep }) => {
      const time = withTime && ep.stamp ? new Date(ep.stamp).toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' }) : '';
      return `<div class="row">
        <img class="thumb" src="${esc(show.img || '')}" alt="" data-open="${show.id}" loading="lazy">
        <div class="body" data-open="${show.id}"><div class="t1">${esc(show.name)}</div>
        <div class="t2">${premiere ? `<span class="pill ${ep.s === 1 ? 'accent' : 'neutral'}">${ep.s === 1 ? 'Új sorozat' : ep.s > 1900 ? ep.s + '-es kiadás' : ep.s + '. évad'}</span> ${esc((show.genres || []).slice(0, 2).join(', '))}` : `<span class="code">${code(ep)}</span> · ${esc(ep.name)}`}</div>
        <div class="t3">${[time && time + ' (magyar idő)', show.network].filter(Boolean).map(esc).join(' · ')}</div></div>
        ${state.follows[show.id] ? '<span class="pill accent">Követed</span>' : ''}</div>`;
    }).join('')}</div></div>`).join('');
}

/* ---------- Search ---------- */
function renderSearch(v, alive) {
  v.innerHTML = `<div class="search">${ICON.search}
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="Sorozat címe, pl. Severance" value="${esc(searchQ)}" aria-label="Sorozat keresése">
    <button class="clear" id="qclear" aria-label="Keresés törlése" ${searchQ ? '' : 'hidden'}>${ICON.x}</button></div>
    <section id="results"></section>`;
  const q = $('#q');
  q.addEventListener('input', () => { searchQ = q.value; $('#qclear').hidden = !searchQ; clearTimeout(renderSearch.t); renderSearch.t = setTimeout(() => runSearch(alive), 320); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(renderSearch.t); runSearch(alive); q.blur(); } });
  $('#qclear').addEventListener('click', () => { searchQ = ''; q.value = ''; $('#qclear').hidden = true; runSearch(alive); q.focus(); });
  runSearch(alive);
  if (!searchQ && matchMedia('(pointer:fine)').matches) q.focus();
}
async function runSearch(alive) {
  const box = $('#results'); if (!box) return;
  const query = searchQ.trim();
  if (!query) {
    box.innerHTML = `<div class="sec-head"><h2>Népszerű sorozatok</h2></div><div id="pop">${skelGrid(6)}</div>`;
    try { const list = await getPopular(); if (alive() && $('#pop') && !searchQ.trim()) $('#pop').innerHTML = `<div class="grid">${list.map(s => showCard(s)).join('')}</div>`; }
    catch { if ($('#pop')) $('#pop').innerHTML = errorBox(NET_ERR); }
    return;
  }
  box.innerHTML = skelGrid(6);
  try {
    const res = await searchShows(query);
    if (!alive() || searchQ.trim() !== query) return;
    box.innerHTML = res.length
      ? `<div class="sec-head"><h2>Találatok</h2><span class="count">${res.length} sorozat</span></div><div class="grid">${res.map(s => showCard(s)).join('')}</div>`
      : `<div class="empty"><h3>Nincs találat erre: „${esc(query)}”</h3><p>Próbáld az eredeti (angol) címmel, vagy írj be csak egy részletet a címből.</p></div>`;
  } catch { if (alive()) box.innerHTML = errorBox(NET_ERR); }
}

      const items = await premieres();
      if (!alive()) return;
      box.innerHTML = items.length
        ? `<p class="note">Új sorozatok és új évadok első részei a következő 7 napban: streaming, amerikai és magyar csatornák. ${items.length} cím.</p>` + groupByDay(items, false, true)
        : `<div class="empty"><h3>Nincs bejelentett premier</h3><p>A következő 7 napra most nincs adat.</p></div>`;
      return;
    }
    if (calSeg === 'movies') { await renderMovies(box, alive); return; }
    if (calSeg === 'mine') {
      const ids = Object.keys(state.follows);
      if (!ids.length) { box.innerHTML = `<div class="empty"><h3>Még nem követsz sorozatot</h3><p>A követett sorozataid következő részei itt jelennek meg napokra bontva.</p><button class="btn primary" data-tab="search">${ICON.search}Sorozat keresése</button></div>`; return; }
      const data = await pool(ids, 4, async id => ({ show: state.follows[id], eps: await getEps(id) || [] }));
      if (!alive()) return;
      const end = addDays(today(), 45), items = [];
      data.forEach(({ show, eps }) => regular(eps).filter(e => e.date && e.date >= today() && e.date <= end).forEach(ep => items.push({ show, ep })));
      items.sort((a, b) => (a.ep.stamp || a.ep.date).localeCompare(b.ep.stamp || b.ep.date));
      box.innerHTML = items.length ? groupByDay(items) : `<div class="empty"><h3>Nincs bejelentett új rész</h3><p>A követett sorozataidnak a következő 45 napban nem jelenik meg új epizódja. Ha bejelentenek egyet, itt látod.</p></div>`;
    } else {
      const path = calSeg === 'web' ? `/schedule/web?date=${today()}` : `/schedule?country=HU&date=${today()}`;
      const raw = await api(path, 3 * H, a => a.map(x => ({ show: slimShow(x._embedded?.show || x.show), ep: slimEp(x) })));
      if (!alive()) return;
      const seen = new Set();
      const items = (raw || []).filter(x => x.show && x.ep.n != null && !seen.has(x.show.id) && seen.add(x.show.id))
        .sort((a, b) => calSeg === 'hu'
          ? (a.ep.stamp || '').localeCompare(b.ep.stamp || '')
          : (b.show.weight || 0) - (a.show.weight || 0) || (b.show.img ? 1 : 0) - (a.show.img ? 1 : 0));
      box.innerHTML = items.length
        ? `<p class="note">${calSeg === 'web' ? 'Ma megjelenő részek a streamingszolgáltatóknál, népszerűség szerint.' : 'Ma a magyar tévécsatornákon, időrendben.'} ${items.length} sorozat.</p>` + groupByDay(items, calSeg === 'hu')
        : `<div class="empty"><h3>Mára nincs adat</h3><p>Erre a napra az adatbázisban nincs műsor ebben a nézetben.</p></div>`;
    }
  } catch { if (alive()) box.innerHTML = errorBox(NET_ERR); }
}

/* ---------- Upcoming: series premieres (TVmaze) and cinema releases (TMDB) ---------- */
async function premieres() {
  const days = Array.from({ length: 7 }, (_, i) => addDays(today(), i));
  const paths = days.flatMap(d => [`/schedule/web?date=${d}`, `/schedule?country=US&date=${d}`, `/schedule?country=HU&date=${d}`]);
  const lists = await pool(paths, 4, p => api(p, 6 * H, a => a.filter(x => x.number === 1)
    .map(x => ({ show: slimShow(x._embedded?.show || x.show), ep: slimEp(x) }))).catch(() => []));
  const best = new Map();
  lists.flat().forEach(it => {
    if (!it.show || !it.ep.date) return;
    const hu = /^(rtl|tv2|m1|duna|super tv2)/i.test(it.show.network || '');
    if (!hu && (it.show.weight || 0) < 85) return;
    const cur = best.get(it.show.id);
    if (!cur || it.ep.date < cur.ep.date) best.set(it.show.id, it);
  });
  return [...best.values()].sort((a, b) => a.ep.date.localeCompare(b.ep.date) || (b.show.weight || 0) - (a.show.weight || 0));
}

const TMDB = 'https://api.themoviedb.org/3', TIMG = 'https://image.tmdb.org/t/p/';
const tmdbKey = () => (state.tmdb || '').trim();
async function tmdb(path, ttl = DAY) {
  const k = tmdbKey();
  if (!k) throw new Error('nokey');
  const bearer = k.length > 40;
  const cacheKey = 'sn.c.tmdb' + path, c = ls.get(cacheKey, null);
  if (c && Date.now() - c.t < ttl) return c.d;
  const url = TMDB + path + (bearer ? '' : (path.includes('?') ? '&' : '?') + 'api_key=' + encodeURIComponent(k));
  const r = await fetch(url, { headers: bearer ? { Authorization: 'Bearer ' + k } : {} });
  if (r.status === 401) throw new Error('badkey');
  if (!r.ok) { if (c) return c.d; throw new Error('HTTP ' + r.status); }
  const d = await r.json();
  ls.set(cacheKey, { t: Date.now(), d });
  return d;
}
const tmdbHelp = `<ol class="steps">
  <li>Regisztrálj ingyen a <a href="https://www.themoviedb.org/signup" target="_blank" rel="noopener">themoviedb.org</a> oldalon.</li>

  <div><button class="btn primary" data-settings>Kulcs megadása</button></div></div>`;
const keyError = e => e.message === 'badkey' ? errorBox('A megadott TMDB-kulcs nem érvényes. Ellenőrizd a Beállításokban.') : errorBox(NET_ERR);

async function renderMovies(box, alive) {
  if (!tmdbKey()) { box.innerHTML = noKeyPanel('Mozifilmek és előzetesek'); return; }
  try {
    const pages = await Promise.all([1, 2, 3].map(p => tmdb(`/movie/upcoming?language=hu-HU&region=HU&page=${p}`, 12 * H).catch(() => ({ results: [] }))));
    if (!alive()) return;
    const t = today(), seen = new Set();
    const movies = pages.flatMap(p => p.results || []).filter(m => m.release_date >= t && !seen.has(m.id) && seen.add(m.id))
      .sort((a, b) => a.release_date.localeCompare(b.release_date) || b.popularity - a.popularity);
    if (!movies.length) { box.innerHTML = `<div class="empty"><h3>Nincs bejelentett bemutató</h3><p>A következő hetekre most nincs adat a magyar mozibemutatókról.</p></div>`; return; }
    const days = new Map();
    movies.forEach(m => { if (!days.has(m.release_date)) days.set(m.release_date, []); days.get(m.release_date).push(m); });
    box.innerHTML = `<p class="note">Magyarországi mozibemutatók. Koppints egy filmre az előzetesért.</p>` + [...days].map(([d, arr]) => `<div class="day"><h3><b>${dayLabel(d)}</b> · ${fmtDate(d)}</h3><div class="list">
      ${arr.map(m => `<div class="row" data-movie="${m.id}">

        <div class="body"><div class="t1">${esc(m.title)}</div>
        <div class="t2">${m.original_title !== m.title ? esc(m.original_title) : '&nbsp;'}</div>
        <div class="t3">Mozibemutató · ${relDays(d)}${m.vote_count > 20 ? ` · ★ ${m.vote_average.toFixed(1)}` : ''}</div></div><span class="pill accent">Mozi</span></div>`).join('')}

/* ---------- Trailers (TMDB → YouTube, played inside the app) ---------- */
function pickTrailer(results) {
  const score = v => (v.type === 'Trailer' ? 4 : v.type === 'Teaser' ? 2 : 0) + (v.iso_639_1 === 'hu' ? 3 : 0) + (v.official ? 1 : 0);
  return (results || []).filter(v => v.site === 'YouTube').sort((a, b) => score(b) - score(a))[0] || null;
}
async function trailerForShow(s) {
  let id = null;
  if (s.imdb) id = (await tmdb(`/find/${s.imdb}?external_source=imdb_id`, 7 * DAY)).tv_results?.[0]?.id;
  if (!id) id = (await tmdb(`/search/tv?query=${encodeURIComponent(s.name)}${s.premiered ? '&first_air_date_year=' + s.premiered.slice(0, 4) : ''}`, 7 * DAY)).results?.[0]?.id;
  if (!id) return null;
  return pickTrailer((await tmdb(`/tv/${id}/videos?language=hu-HU&include_video_language=hu,en,null`)).results);
}
const ytSearch = title => `https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' előzetes trailer')}`;
function trailerPanel() { return `<div class="panel" id="trailerPanel"><h3>Előzetes</h3><div data-tslot><div class="skel" style="aspect-ratio:16/9"></div></div></div>`; }
async function fillTrailer(promise, title) {

      <a class="btn ghost" style="text-decoration:none" href="${ytSearch(title)}" target="_blank" rel="noopener">${ICON.ext}Keresés a YouTube-on</a></div>`;

    slot.innerHTML = t
      ? `<button class="yt" data-yt="${esc(t.key)}" aria-label="Előzetes lejátszása" style="background-image:url('https://i.ytimg.com/vi/${esc(t.key)}/hqdefault.jpg')"><span class="play">${ICON.play}</span></button>

/* ---------- Watch now: public-domain films from the Internet Archive ---------- */
const IA = 'https://archive.org';
const IA_BASE = 'mediatype:movies AND licenseurl:*publicdomain* AND format:("h.264" OR "512Kb MPEG4")';
const IA_GENRES = [['pop', 'Népszerű', 'collection:feature_films'], ['comedy', 'Vígjáték', 'collection:Comedy_Films'], ['noir', 'Film noir', 'collection:Film_Noir'],
  ['scifi', 'Sci-fi és horror', 'collection:SciFi_Horror'], ['western', 'Western', 'collection:feature_films AND subject:western'], ['silent', 'Némafilm', 'collection:silent_films'], ['tv', 'Régi tévésorozatok', 'collection:classic_tv']];
let iaGenre = 'pop', iaQ = '', iaPage = 1;
const iaThumb = id => `${IA}/services/img/${encodeURIComponent(id)}`;
function iaSearch(genre, text, page) {
  let q = `${IA_BASE} AND (${IA_GENRES.find(g => g[0] === genre)[2]})`;
  const clean = text.replace(/[^\p{L}\p{N} ]/gu, ' ').trim();
  if (clean) q += ` AND title:(${clean})`;
  return api(`${IA}/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier&fl[]=title&fl[]=year&rows=24&page=${page}&sort[]=downloads+desc&output=json`, 12 * H,
    d => ({ total: d.response?.numFound || 0, docs: (d.response?.docs || []).map(x => ({ id: x.identifier, title: Array.isArray(x.title) ? x.title[0] : x.title, year: x.year })) }));
}
const filmCard = f => `<button class="card" data-film="${esc(f.id)}" aria-label="${esc(f.title)}">
  <img class="poster" src="${iaThumb(f.id)}" alt="${esc(f.title)}" loading="lazy" onerror="this.outerHTML='<div class=&quot;poster-ph&quot;>'+this.alt.replace(/[<&]/g,'')+'</div>'">
  <span class="name">${esc(f.title)}</span><span class="meta">${esc(f.year || 'Klasszikus')}</span></button>`;
const FREE_HU = [
  ['https://mediaklikk.hu/', 'Médiaklikk', 'Az M1, a Duna és az M2 műsorai, filmek, sorozatok és mesék, ingyen'],
  ['https://www.rtlplusz.hu/', 'RTL+', 'Az ingyenes része regisztrációval nézhető (sorozatok, műsorok)'],
  ['https://tv2play.hu/', 'TV2 Play', 'Az ingyenes része reklámokkal nézhető'],
  ['https://filmio.hu/', 'Filmio', 'A Nemzeti Filmintézet magyar filmtára, időszakonként ingyenes akciókkal']];
function renderWatch(v, alive) {
  v.innerHTML = `<section><div class="sec-head"><h2>Klasszikus filmek, ingyen</h2></div>
      <p class="note">Közkincs (public domain) filmek és régi sorozatok az Internet Archive-ból. Az appban indulnak, reklám nélkül. Többnyire angol nyelvűek, felirat nélkül; a némafilmekhez nem kell nyelvtudás.</p>
      <div class="search">${ICON.search}<input id="iaq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Film címe, pl. Chaplin" value="${esc(iaQ)}" aria-label="Klasszikus film keresése"></div>
      <div class="seg" role="group" aria-label="Műfaj">${IA_GENRES.map(([k, l]) => `<button data-genre="${k}" aria-pressed="${iaGenre === k}">${l}</button>`).join('')}</div>
      <div id="ia">${skelGrid(6)}</div></section>
    <div class="panel"><h3>Ingyenes magyar források</h3><p>Ezek a saját oldalukon nyílnak meg.</p>
      <div class="where">${FREE_HU.map(([u, n, d]) => `<a href="${u}" target="_blank" rel="noopener"><b>${n}</b><small>${d}</small>${ICON.ext}</a>`).join('')}</div></div>`;
  const q = $('#iaq');
  q.addEventListener('input', () => { clearTimeout(renderWatch.t); renderWatch.t = setTimeout(() => { iaQ = q.value; iaPage = 1; loadIA(alive, false); }, 400); });
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(renderWatch.t); iaQ = q.value; iaPage = 1; loadIA(alive, false); q.blur(); } });
  iaPage = 1; loadIA(alive, false);

async function loadIA(alive, append) {
  const box = $('#ia'); if (!box) return;
  const want = `${iaGenre}|${iaQ}|${iaPage}`;
  if (!append) box.innerHTML = skelGrid(6);
  try {
    const res = await iaSearch(iaGenre, iaQ, iaPage);
    if (!alive() || `${iaGenre}|${iaQ}|${iaPage}` !== want || !$('#ia')) return;
    const grid = box.querySelector('.grid');
    const cards = res.docs.map(filmCard).join('');
    if (append && grid) grid.insertAdjacentHTML('beforeend', cards);
    else box.innerHTML = res.docs.length ? `<div class="grid">${cards}</div>` : `<div class="empty"><h3>Nincs találat</h3><p>Próbáld angol címmel, vagy válassz másik műfajt.</p></div>`;
    box.querySelector('.more')?.remove();
    if (res.total > iaPage * 24) box.insertAdjacentHTML('beforeend', `<button class="btn ghost more" data-iamore style="margin-top:14px">Továbbiak (${res.total - iaPage * 24})</button>`);
  } catch { if (alive()) box.innerHTML = errorBox('Nem sikerült elérni az Internet Archive-ot. Próbáld újra kicsit később.'); }
}

async function renderLibrary(v, alive) {
  const shows = Object.values(state.follows);
  if (!shows.length) {
    v.innerHTML = `<div class="empty"><h3>A listád még üres</h3><p>Nyisd meg egy sorozat adatlapját, és koppints a „Listára teszem” gombra. Ha kipipálsz egy részt, a sorozat magától felkerül ide.</p><button class="btn primary" data-tab="search">${ICON.search}Sorozat keresése</button></div>`;

  }
  v.innerHTML = `<section><div class="sec-head"><h2>${shows.length} sorozat</h2></div>${skelGrid(Math.min(shows.length, 9))}</section>`;
  let data;
  try { data = await pool(shows, 4, async s => ({ s, p: progressOf(s.id, await getEps(s.id) || []) })); }
  catch { if (alive()) v.innerHTML = errorBox(NET_ERR); return; }
  if (!alive()) return;
  const groups = [
    ['Folyamatban', data.filter(x => x.p.next && x.p.watched > 0)],

  v.innerHTML = groups.map(([title, arr]) => `<section><div class="sec-head"><h2>${title}</h2><span class="count">${arr.length}</span></div>
    <div class="grid">${arr.sort((a, b) => a.s.name.localeCompare(b.s.name, 'hu')).map(({ s, p }) => {
      const pct = p.aired ? Math.round(p.watched / p.aired * 100) : 0;
      const meta = !p.next && p.upcoming ? `új rész ${relDays(p.upcoming.date)}` : !p.next && s.status === 'Ended' ? 'befejezett sorozat' : `${p.watched}/${p.aired} rész`;
      return showCard(s, `<div class="progress ${pct === 100 ? 'done' : ''}"><i style="width:${pct}%"></i></div><span class="meta">${esc(meta)}</span>`);
    }).join('')}</div></section>`).join('');
}

/* ---------- Detail sheet ---------- */
let sheetShow = null, sheetSeason = null, sheetEps = [], summaryOpen = false, sheetHu = null;
function whereSection(s) {
  const sv = serviceOf(s), my = mine(s), title = sheetHu || s.name, q = encodeURIComponent(title);
  const link = (href, name, note) => `<a href="${esc(href)}" target="_blank" rel="noopener"><b>${esc(name)}</b><small>${esc(note)}</small>${ICON.ext}</a>`;
  const rows = [link(`https://www.justwatch.com/hu/search?q=${encodeURIComponent(s.name)}`, 'JustWatch', 'Minden magyarországi szolgáltató egy helyen, az ingyenes lehetőségekkel együtt')];
  if (sv?.id === 'mtva' || !sv || sv.free) rows.push(link(`https://mediaklikk.hu/?s=${q}`, 'Médiaklikk', 'Ingyenes közmédia (M1, Duna, M2) · keresés erre: ' + title));
  if (sv?.id === 'rtl') rows.push(link(sv.url, 'RTL+', `Részben ingyenes · megnyitja a keresőt, írd be: ${title}`));
  if (sv?.id === 'tv2') rows.push(link(sv.url, 'TV2 Play', `Részben ingyenes · megnyitja a keresőt, írd be: ${title}`));
  const head = my ? `<span class="pill ok">✓ Valószínűleg benne van: ${esc(my.name)}</span>`

  return `<div class="panel" id="where"><h3>Hol nézhető?</h3>${head ? `<div>${head}</div>` : ''}
    <div class="where">${rows.join('')}</div>
    <p>Az előfizetéses egyezést az eredeti csatorna alapján becsüljük. Magyarországon egy sorozat néha máshol fut, ezt a JustWatch pontosan mutatja.</p></div>`;
}
function renderPlaceholder() {

}
function markActive(id) { document.querySelectorAll('.card').forEach(c => c.classList.toggle('active', wide.matches && +c.dataset.open === id)); }
const closeBtn = `<button class="iconbtn" data-close aria-label="Bezárás"><span class="ico-back">${ICON.back}</span><span class="ico-x">${ICON.x}</span></button>`;

/* ---------- Settings ---------- */
function openSettings(push = true) {
  if (push) history.pushState({ settings: 1 }, '', '#beallitasok');
  const sh = $('#sheet'); sh.hidden = false; sh.scrollTop = 0; sheetShow = null;
  if (!wide.matches) document.body.style.overflow = 'hidden';
  renderSettings();
}
async function renderSettings() {
  const perm = 'Notification' in window ? Notification.permission : 'unsupported';
  const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
  const bg = !!(reg && 'periodicSync' in reg);
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let notifNote;
  if (perm === 'unsupported') notifNote = 'Ez a böngésző nem támogat értesítéseket. iPhone-on előbb tedd ki az appot a főképernyőre, és onnan nyisd meg.';
  else if (perm === 'denied') notifNote = 'Az értesítések le vannak tiltva ennél az oldalnál. A böngésző vagy a telefon beállításaiban tudod engedélyezni.';
  else if (bg) notifNote = 'A telefon a háttérben is ellenőrzi az új részeket. A gyakoriságot a rendszer dönti el, általában naponta egyszer.';
  else notifNote = standalone ? 'Ezen az eszközön a háttérben futó ellenőrzés nem támogatott, ezért az új részeket az app megnyitásakor jelezzük („ÚJ” jelölés és üzenet).'
    : 'A háttérben futó ellenőrzéshez telepítsd az appot a kezdőképernyőre (Androidon Chrome-mal). Addig az új részeket megnyitáskor jelezzük.';
  $('#sheet').innerHTML = `<div class="sheet-bar">${closeBtn}</div>
    <div class="sheet-body"><h2 style="font:800 26px/1.1 var(--font-display);margin:0">Beállítások</h2>
    <div class="panel"><h3>Szolgáltatóim</h3><p>Jelöld be, mire fizetsz elő, vagy mit nézel ingyen. Ezeket kiemeljük a kezdőlapon és az adatlapokon.</p>
      <div class="chips">${SERVICES.map(s => `<button class="chip" data-service="${s.id}" aria-pressed="${state.services.includes(s.id)}">${ICON.check}${esc(s.name)}${s.free ? ' <span style="opacity:.7">(ingyenes is)</span>' : ''}</button>`).join('')}</div></div>
    <div class="panel"><h3>Értesítés új részekről</h3><p>${esc(notifNote)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${perm === 'unsupported' || perm === 'denied' ? '' :
        state.notify && perm === 'granted'
          ? `<button class="btn ghost" data-notify="off">Értesítések kikapcsolása</button><button class="btn soft" data-notify="test">Próbaértesítés</button>`
          : `<button class="btn primary" data-notify="on">Értesítések bekapcsolása</button>`}</div></div>
    <div class="panel"><h3>Előzetesek és mozifilmek (TMDB-kulcs)</h3>
      <p>${tmdbKey() ? 'A kulcs be van állítva: az előzetesek az appban indulnak, és látod a mozibemutatókat.' : 'Egy ingyenes kulccsal az előzetesek az appban indulnak, és megjelennek a magyar mozibemutatók is.'}</p>
      ${tmdbKey() ? '' : tmdbHelp}
      <div class="field"><input id="tmdbKey" type="password" autocomplete="off" spellcheck="false" placeholder="API Key vagy API Read Access Token" value="${esc(state.tmdb || '')}" aria-label="TMDB-kulcs">
        <button class="btn primary" data-tmdb="save">Mentés</button>${tmdbKey() ? '<button class="btn ghost" data-tmdb="clear">Törlés</button>' : ''}</div>
      <p id="tmdbMsg" aria-live="polite"></p></div>
    <div class="panel"><h3>Adatok</h3><p>A listád és a megnézett részek csak ezen az eszközön vannak tárolva. A sorozatadatok forrása a TVmaze nyilvános adatbázisa.</p></div>
    </div>`;
}
async function saveTmdb(clear) {
  const msg = $('#tmdbMsg');
  if (clear) { state.tmdb = ''; save(); toast('TMDB-kulcs törölve'); return renderSettings(); }
  const k = ($('#tmdbKey')?.value || '').trim();
  if (!k) { msg.textContent = 'Illeszd be a kulcsot a mezőbe.'; return; }
  msg.textContent = 'Kulcs ellenőrzése…';
  const bearer = k.length > 40;
  try {
    const r = await fetch(`${TMDB}/configuration${bearer ? '' : '?api_key=' + encodeURIComponent(k)}`, { headers: bearer ? { Authorization: 'Bearer ' + k } : {} });
    if (r.status === 401) { msg.textContent = 'Ez a kulcs nem érvényes. Ellenőrizd, hogy a teljes kulcsot másoltad-e be.'; return; }
    if (!r.ok) throw new Error();
  } catch { msg.textContent = 'Nem sikerült ellenőrizni a kulcsot. Ellenőrizd az internetkapcsolatot.'; return; }
  state.tmdb = k; save(); toast('TMDB-kulcs elmentve'); renderSettings();
}
async function setNotify(on) {
  if (!on) { state.notify = false; save(); toast('Értesítések kikapcsolva'); return renderSettings(); }
  const perm = await Notification.requestPermission().catch(() => 'denied');
  if (perm !== 'granted') { toast('Az értesítések nincsenek engedélyezve'); return renderSettings(); }
  state.notify = true; save();
  try { const c = await caches.open('sn-data'); await c.put('sn-check.json', new Response(JSON.stringify({ last: Date.now() }))); } catch {}
  try {
    const reg = await navigator.serviceWorker.ready;
    if ('periodicSync' in reg) await reg.periodicSync.register('new-episodes', { minInterval: 12 * H });
  } catch {}
  toast('Értesítések bekapcsolva');
  renderSettings();
}
async function testNotify() {
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('Sorozatnapló', { body: 'Így fog kinézni, ha új rész jelenik meg egy követett sorozatodból.', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'test' });
  } catch { toast('A próbaértesítés nem sikerült ezen az eszközön'); }
}
async function openShow(id, push = true) {
  const sh = $('#sheet');
  if (push) pushSheet({ show: id }, '#sorozat-' + id);
  sh.hidden = false; sh.scrollTop = 0; if (!wide.matches) document.body.style.overflow = 'hidden';
  sheetShow = null; sheetSeason = null; summaryOpen = false; sheetHu = null;
  markActive(id);
  sh.innerHTML = `<div class="sheet-bar">${closeBtn}</div>
    <div class="sheet-body"><div class="hero"><div class="skel" style="aspect-ratio:2/3"></div><div style="display:flex;flex-direction:column;gap:10px"><div class="skel" style="height:26px;width:80%"></div><div class="skel" style="height:14px;width:50%"></div></div></div>${skelRows(5)}</div>`;
  try {
    const [show, eps, hu] = await Promise.all([getShow(id), getEps(id), getHuName(id)]);
    if (!show) throw new Error('missing');
    if (sh.hidden || location.hash !== '#sorozat-' + id) return;
    sheetShow = show; sheetEps = eps || []; sheetHu = hu;
    if (state.follows[id]) { // keep stored summary fresh (status, poster)
      Object.assign(state.follows[id], { name: show.name, img: show.img, network: show.network, status: show.status }); save();
    }
    const p = progressOf(id, sheetEps);
    const seasons = [...new Set(regular(sheetEps).map(e => e.s))];
    sheetSeason = p.next ? p.next.s : seasons[seasons.length - 1] ?? null;
    sheetTrailerNode = null;
    renderSheet();
    fillTrailer(tmdbKey() ? trailerForShow(show) : null, sheetHu || show.name);
  } catch {
    sh.querySelector('.sheet-body').innerHTML = errorBox(NET_ERR);
  }
}
function closeShow() {
  document.body.style.overflow = '';
  if (location.hash) history.replaceState(null, '', location.pathname);
  if (wide.matches) renderPlaceholder(); else { $('#sheet').hidden = true; sheetShow = null; }
  render(); // reflect any changes
}
const sheetOpen = () => !!(history.state?.show || history.state?.settings || history.state?.film || history.state?.movie);
function pushSheet(st, hash) { if (wide.matches && sheetOpen()) history.replaceState(st, '', hash); else history.pushState(st, '', hash); }
function showSheet() {
  const sh = $('#sheet'); sh.hidden = false; sh.scrollTop = 0; sheetShow = null;
  if (!wide.matches) document.body.style.overflow = 'hidden';
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
}
let sheetTrailerNode = null;
function renderSheet() {
  // keep the trailer element (and a playing video) across re-renders of the sheet
  const oldTrailer = document.querySelector('#sheet #trailerPanel');
  if (oldTrailer) sheetTrailerNode = oldTrailer;
  renderSheetInner();
  const slot = document.querySelector('#sheet #trailerPanel');
  if (slot && sheetTrailerNode && sheetTrailerNode !== slot) slot.replaceWith(sheetTrailerNode);
}
function renderSheetInner() {
  const s = sheetShow, eps = regular(sheetEps), p = progressOf(s.id, sheetEps), followed = !!state.follows[s.id];
  const seasons = [...new Set(eps.map(e => e.s))];
  const inSeason = eps.filter(e => e.s === sheetSeason);
  const seasonAired = inSeason.filter(aired);
  const seasonAllWatched = seasonAired.length && seasonAired.every(e => isWatched(s.id, e.id));
  const facts = [statusPill(s.status), s.rating ? `<span class="pill neutral">★ ${s.rating.toFixed(1)}</span>` : '', s.runtime ? `<span class="pill neutral">${s.runtime} perc</span>` : '', ...s.genres.slice(0, 3).map(g => `<span class="pill neutral">${esc(g)}</span>`)].join('');
  const years = s.premiered ? (s.ended ? `${s.premiered.slice(0, 4)}–${s.ended.slice(0, 4)}` : `${s.premiered.slice(0, 4)}–`) : '';
  const nextLine = p.next ? `Következő: <span class="code">${code(p.next)}</span> · ${esc(p.next.name)}` : p.upcoming ? `Új rész: <span class="code">${code(p.upcoming)}</span> · ${fmtDate(p.upcoming.date)}` : '';
  $('#sheet').innerHTML = `<div class="sheet-bar">${closeBtn}
      ${s.url ? `<a class="iconbtn" href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="Megnyitás a TVmaze-en">${ICON.ext}</a>` : ''}</div>
    <div class="sheet-body">
      <div class="hero">${posterImg(s)}<div style="min-width:0">
        <h2>${esc(s.name)}</h2>${sheetHu && sheetHu !== s.name ? `<div class="note" style="color:var(--fg)">Magyar cím: ${esc(sheetHu)}</div>` : ''}<div class="note">${esc([years, s.network].filter(Boolean).join(' · '))}</div>
        <div class="facts">${facts}</div>
        <div class="actions"><button class="btn ${followed ? 'soft' : 'primary'}" data-follow>${followed ? ICON.check + 'A listádon' : ICON.plus + 'Listára teszem'}</button>
          <button class="btn ghost" data-where>Hol nézhető?</button></div>
      </div></div>
      ${trailerPanel()}
      ${s.summary ? `<div><p class="summary ${summaryOpen ? '' : 'clamp'}" lang="${s.lang === 'Hungarian' ? 'hu' : 'en'}">${esc(s.summary)}</p>${s.summary.length > 220 ? `<button class="linkbtn" data-more>${summaryOpen ? 'Kevesebb' : 'Tovább olvasom'}</button>` : ''}</div>` : ''}
      <div class="stat"><div><b>${p.watched}</b><span>megnézett rész</span></div><div><b>${Math.max(p.aired - p.watched, 0)}</b><span>hátralévő rész</span></div><div><b>${seasons.length}</b><span>évad</span></div></div>
      ${nextLine ? `<div class="note" style="color:var(--fg)">${nextLine}</div>` : ''}
      ${whereSection(s)}
      ${seasons.length ? `<section>
        <div class="seg" role="group" aria-label="Évad választása">${seasons.map(n => {
          const se = eps.filter(e => e.s === n && aired(e)); const done = se.length && se.every(e => isWatched(s.id, e.id));
          return `<button data-pick="${n}" aria-pressed="${n === sheetSeason}">${n}. évad${done ? ' ✓' : ''}</button>`; }).join('')}</div>
        <div class="sec-head"><span class="label">${sheetSeason}. évad · ${inSeason.length} rész</span>
          ${seasonAired.length ? `<button class="btn small ${seasonAllWatched ? 'ghost' : 'soft'}" data-season="${seasonAllWatched ? 'off' : 'on'}">${seasonAllWatched ? 'Jelölés visszavonása' : 'Egész évad megnézve'}</button>` : ''}</div>
        <div class="list">${inSeason.map(e => {
          const a = aired(e), w = isWatched(s.id, e.id);
          return `<div class="ep ${a ? '' : 'future'}"><span class="no">${e.n}.</span>
            <div style="min-width:0"><div class="t">${esc(e.name)}</div><div class="d">${a ? fmtDate(e.date) : 'Megjelenik: ' + fmtDate(e.date)}${e.rt ? ` · ${e.rt} perc` : ''}</div></div>
            <button class="check" data-ep="${s.id}:${e.id}" aria-pressed="${w}" ${a ? '' : 'disabled'} aria-label="${esc(code(e))} ${w ? 'megnézve' : 'megjelölése megnézettként'}">${ICON.check}</button></div>`;
        }).join('')}</div></section>` : `<p class="note">Ehhez a sorozathoz még nincsenek epizódadatok.</p>`}
      <p class="note">Adatok: TVmaze. A leírások az adatbázisból származnak, többnyire angol nyelvűek.</p>
    </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-open],[data-ep],[data-follow],[data-close],[data-pick],[data-season],[data-seg],[data-more],[data-settings],[data-service],[data-notify],[data-where],[data-yt],[data-film],[data-movie],[data-genre],[data-iamore],[data-tmdb]');
  if (!t) return;
  if (t.dataset.yt) { playYouTube(t); return; }
  if (t.dataset.film) { openFilm(t.dataset.film); return; }
  if (t.dataset.movie) { openMovie(+t.dataset.movie); return; }
  if (t.dataset.genre) { iaGenre = t.dataset.genre; iaPage = 1; document.querySelectorAll('[data-genre]').forEach(b => b.setAttribute('aria-pressed', b === t)); const id = renderId; loadIA(() => id === renderId, false); return; }
  if (t.hasAttribute('data-iamore')) { iaPage++; t.disabled = true; t.textContent = 'Betöltés…'; const id = renderId; loadIA(() => id === renderId, true); return; }
  if (t.dataset.tmdb) { saveTmdb(t.dataset.tmdb === 'clear'); return; }
  if (t.dataset.tab) { if (sheetOpen()) history.back(); setTab(t.dataset.tab); return; }
  if (t.dataset.open) { openShow(+t.dataset.open); return; }
  if (t.hasAttribute('data-close')) { sheetOpen() ? history.back() : closeShow(); return; }
  if (t.hasAttribute('data-settings')) {
    if (history.state?.settings) return;
    if (sheetOpen()) { history.replaceState({ settings: 1 }, '', '#beallitasok'); openSettings(false); } else openSettings();
    return;
  }
  if (t.dataset.service) {
    const id = t.dataset.service, i = state.services.indexOf(id);
    i >= 0 ? state.services.splice(i, 1) : state.services.push(id);
    save(); t.setAttribute('aria-pressed', i < 0);
    if (wide.matches) render();
    return;
  }
  if (t.dataset.notify) { t.dataset.notify === 'test' ? testNotify() : setNotify(t.dataset.notify === 'on'); return; }
  if (t.hasAttribute('data-where')) { $('#where')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
  if (t.dataset.seg) { calSeg = t.dataset.seg; render(); return; }
  if (t.hasAttribute('data-more')) { summaryOpen = !summaryOpen; renderSheet(); return; }
  if (t.hasAttribute('data-follow')) { toggleFollow(sheetShow); renderSheet(); return; }
  if (t.dataset.pick) { sheetSeason = +t.dataset.pick; renderSheet(); return; }
  if (t.dataset.season) {
    const ids = regular(sheetEps).filter(x => x.s === sheetSeason && aired(x)).map(x => x.id);
    await setWatched(sheetShow.id, ids, t.dataset.season === 'on');
    if (t.dataset.season === 'off') toast(`${sheetSeason}. évad jelölése visszavonva`);
    renderSheet(); return;
  }
  if (t.dataset.ep) {
    const [sid, eid] = t.dataset.ep.split(':').map(Number);
    const on = !isWatched(sid, eid);
    t.setAttribute('aria-pressed', on);
    await setWatched(sid, [eid], on);
    if (!$('#sheet').hidden && sheetShow?.id === sid) renderSheet();
    else setTimeout(render, 350); // let the tick show before the row moves on
  }
});
window.addEventListener('popstate', () => {
  const m = location.hash.match(/^#sorozat-(\d+)$/);
  const f = location.hash.match(/^#film-(.+)$/), mv = location.hash.match(/^#mozi-(\d+)$/);
  if (m) openShow(+m[1], false);
  else if (f) openFilm(decodeURIComponent(f[1]), false);
  else if (mv) openMovie(+mv[1], false);
  else if (location.hash === '#beallitasok') openSettings(false);
  else closeShow();
});
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive: true });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen()) history.back(); });
wide.addEventListener('change', () => {
  document.body.style.overflow = '';
  if (sheetOpen()) { if (!wide.matches) document.body.style.overflow = 'hidden'; return; }
  if (wide.matches) renderPlaceholder(); else $('#sheet').hidden = true;
  render();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncWorkerData(); });

/* ---------- start ---------- */
try { const t = sessionStorage.getItem('sn.tab'); if (TITLES[t]) tab = t; } catch {}
document.querySelectorAll('.tab').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
updateBadge();
syncWorkerData();
if (wide.matches) renderPlaceholder();
render();
const m0 = location.hash.match(/^#sorozat-(\d+)$/);
if (m0) { history.replaceState(null, '', location.pathname); history.pushState({ show: +m0[1] }, '', '#sorozat-' + m0[1]); openShow(+m0[1], false); }
else if (location.hash === '#beallitasok') { history.replaceState(null, '', location.pathname); openSettings(); }
else if (/^#film-.+/.test(location.hash)) { const id = decodeURIComponent(location.hash.slice(6)); history.replaceState(null, '', location.pathname); openFilm(id); }
else if (/^#mozi-\d+$/.test(location.hash)) { const id = +location.hash.slice(6); history.replaceState(null, '', location.pathname); openMovie(id); }
else if (location.hash) history.replaceState(null, '', location.pathname);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
